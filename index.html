
<!DOCTYPE html>
<html>
<head>
    <title>Our Animation</title>
    
<link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="scene">
        <div class="stars">
  <div class="star" style="top: 15%; left: 20%;"></div>
  <div class="star" style="top: 25%; left: 75%; animation-delay: 1s;"></div>
  <div class="star" style="top: 40%; left: 35%; animation-delay: 2s;"></div>
  <div class="star" style="top: 18%; left: 60%; animation-delay: 3s;"></div>
  <div class="star" style="top: 32%; left: 88%; animation-delay: 1.5s;"></div>
  <div class="star" style="top: 10%; left: 45%; animation-delay: 2.5s;"></div>
</div>
<div class="shooting-star"></div>
        <div class="cloud" style="top: 30%; animation-delay: 0s;"></div>

<div class="cloud" style="top: 45%; animation-delay: 12s; opacity: 0.45; transform: scale(0.8);"></div>

<div class="cloud" style="top: 22%; animation-delay: 22s; transform: scale(1.2);"></div>
        <div class="sun"></div>

        <h1>A Little Moment Together</h1>

        <p>Some moments deserve to last forever.</p>

    </main>

</body>
</html>
